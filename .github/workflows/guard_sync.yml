name: Guard Sync Gate

# mainnet_guard.py + mainnet_verify.py dosyalarinin 25-pqhaven-x402 ( sahip
# repo) ile BIREBIR ayni kalmasini zorunlu kilar. Fark varsa CI FAIL eder.
#
# Karar: docs/29_GUARD_ENTEGRASYON_RAPORU.md §5 ( single-source-of-truth,
# 1. adim = CI cmp gate). Iki repo ayni dosyalari ayri ayir tutar; bu gate
# sessiz sync-bozulmasini engeller ( hard gate).
#
# NOT: sahip repo bu makinede bulundugu icin ( self-hosted runner) gate
# lokal path'lerle calisir. Baska runner'da salt-https ile dogrulamak
# icin asagidaki adimi ENABLE edin ( varsayilan: lokal).
on:
  push:
    paths:
      - 'mainnet_guard.py'
      - 'mainnet_verify.py'
      - 'scripts/guard_sync_gate.sh'
      - '.github/workflows/guard_sync.yml'
  pull_request:
    paths:
      - 'mainnet_guard.py'
      - 'mainnet_verify.py'
      - 'scripts/guard_sync_gate.sh'
      - '.github/workflows/guard_sync.yml'
  workflow_dispatch:

jobs:
  guard-sync:
    runs-on: self-hosted
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout ( bu repo)
        uses: actions/checkout@v4

      - name: Guard sync gate ( mainnet_guard + mainnet_verify)
        run: ./scripts/guard_sync_gate.sh

      - name: Sync bozulduysa net mesaj
        if: failure()
        run: |
          echo "::error::mainnet guard dosyalari 25-pqhaven-x402 ile senkron DEGIL."
          echo "::error::Duzelt: cp /home/gokun/projects/01_unicorn/25-pqhaven-x402/{mainnet_guard.py,mainnet_verify.py} ."
          echo "::error::Gate dokumani: docs/29_GUARD_ENTEGRASYON_RAPORU.md ( §5)"
          exit 1
